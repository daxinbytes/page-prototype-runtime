<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>页面原型</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="eyebrow">本地预览 · 0.7 内测版</span><h1>页面原型</h1><p>在原页面上，试一试新交互。</p></header>
  <main>
    <div class="connection-track" aria-label="预览状态"><span id="service-step">本地服务</span><i>→</i><span id="page-step">目标页面</span><i>→</i><span id="override-step">修改效果</span></div>
    <p id="status" role="status" aria-live="polite">正在读取状态…</p>
    <section>
      <details id="connection-settings" open>
      <summary>连接本地工具</summary>
      <form id="pair-form">
        <label for="port">服务端口</label><input id="port" type="number" value="17373" min="1024" max="65535" required>
        <label for="token">配对码</label><input id="token" type="password" autocomplete="off" placeholder="粘贴本地工具提供的配对码">
        <p class="hint" id="pair-hint">先启动本地工具，再输入配对码。</p>
        <button type="submit" id="connect" class="secondary">连接服务</button>
      </form>
      </details>
    </section>
    <section>
      <h2 id="project-name">尚未连接项目</h2>
      <div id="project-permissions" hidden><p class="hint" id="permission-hint"></p><button id="authorize-project" class="secondary">授权项目站点</button></div>
      <label class="sr-only" for="tabs">目标页面</label><select id="tabs"><option value="">连接后显示可用页面</option></select>
      <p class="hint" id="page-hint">请在 Chrome 中打开并登录项目页面。</p>
      <p id="current-page" class="hint" hidden></p>
      <details id="follow-history" hidden><summary id="follow-summary">最近跟随记录</summary><ol id="follow-events"></ol></details>
      <button id="capture" class="secondary" disabled>采集原始页面</button>
      <p class="hint" id="capture-status">采集后，AI 可读取页面资源与源码索引。</p>
      <p class="hint" id="capture-warnings" hidden></p>
      <div class="scenario-box">
        <p id="current-scenario" class="hint">连接后显示修改方案</p>
        <div class="scenario-picker"><label class="sr-only" for="scenarios">已保存方案</label><select id="scenarios"></select><button id="switch-scenario" class="secondary" disabled>切换</button></div>
        <details id="new-scenario"><summary>基于原始页面 新建方案</summary>
          <form id="scenario-form">
            <label for="scenario-name">新方案名称</label><input id="scenario-name" maxlength="60" required placeholder="例如：搜索交互调整">
            <p class="hint">保留旧方案，刷新所选页面及旧方案影响的页面。请先保存表单输入。</p>
            <button id="create-scenario" class="secondary" disabled>保留旧方案并新建</button>
          </form>
        </details>
        <p class="hint scenario-note">切换会恢复原始页面；选好方案后再应用修改。</p>
      </div>
      <p id="edit-target" class="hint">本次修改目标：尚未绑定</p>
      <div id="pending-sites"></div>
      <div class="actions"><button id="apply" class="secondary" disabled>应用最新修改</button><button id="restore" class="quiet" disabled>停用并恢复</button></div>
      <button id="end" class="quiet" disabled>结束项目协作</button>
    </section>
    <p id="error" role="alert" hidden></p>
    <footer>采集自动跟随；应用修改时只刷新已绑定的目标页。</footer>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
