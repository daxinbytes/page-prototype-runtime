<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面原型</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><strong><span class="logo">P</span> 页面原型</strong><span id="connection-status">未连接</span></header>
<main>
<details id="connection-settings"><summary>连接本地工具</summary><form id="pair-form">
<label for="port">服务端口</label><input id="port" type="number" min="1024" max="65535" value="17373" required>
<label for="token">配对码</label><input id="token" type="password" autocomplete="off" placeholder="已配对可留空复用">
<button id="connect" type="submit" class="secondary">连接服务</button><p class="hint">配对码只在本机使用。</p>
</form></details>
<div class="label-row"><label for="projects">项目 <span id="project-count"></span></label><div class="inline-actions"><button id="delete-project" class="link danger-link" hidden>删除</button><button id="show-new-project" class="link">＋ 新建</button></div></div>
<select id="projects"><option value="">请选择项目</option></select>
<form id="project-form" hidden><label for="project-name">项目名称</label><input id="project-name" maxlength="60" placeholder="例如：产品对比" required><div class="row"><button type="submit" id="create-project">创建项目</button><button type="button" id="cancel-project" class="secondary">取消</button></div></form>
<div id="empty"><h2>先选一个项目</h2><p class="hint">选好项目，再接入需要分析和修改的页面。</p><p class="hint">尚未开始协作，不采集任何页面。</p></div>
<div id="project-content" hidden>
<section><div class="label-row"><h2>项目页面</h2><span class="hint" id="page-count"></span></div>
<div class="current-page"><span class="hint">当前浏览器页面</span><div class="label-row"><strong id="page-title"></strong><span id="page-state" class="hint"></span></div><span id="page-url" class="hint url"></span></div>
<button id="capture" disabled>接入并开始协作</button><p id="capture-hint" class="hint"></p><p id="shared-page" class="hint" hidden></p>
<ul id="pages" aria-label="项目已保存页面"></ul>
<label class="check" id="follow-label" hidden><input id="follow" type="checkbox" checked>自动跟随项目内的页面跳转</label>
</section>
<section><div class="label-row"><h2>方案</h2><div class="inline-actions"><button id="delete-scenario" class="link danger-link" hidden>删除</button><button id="show-new-scenario" class="link">＋ 新建</button></div></div>
<p id="scenario-hint" class="hint"></p><label class="sr-only" for="scenarios">选择方案</label><select id="scenarios"><option value="">请选择方案</option></select>
<form id="scenario-form" hidden><label for="scenario-name">方案名称</label><input id="scenario-name" maxlength="60" placeholder="例如：搜索交互调整" required><p class="hint">从原始页面开始，保留已有方案。</p><div class="row"><button id="create-scenario" type="submit">创建方案</button><button id="cancel-scenario" type="button" class="secondary">取消</button></div></form>
<button id="apply" disabled hidden>查看修改效果</button><p id="preview-source" class="hint"></p>
</section>
<div class="label-row session"><span id="session-status" class="hint">尚未开始协作</span></div>
<details class="diagnostics"><summary>采集详情</summary><p class="hint" id="capture-status"></p><p class="hint" id="capture-warnings"></p><p class="hint" id="status"></p></details>
</div>
<p id="error" role="alert" hidden></p>
<button id="end" class="danger end-session" hidden>结束协作</button>
</main>
<dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
<h2 id="delete-title"></h2><p id="delete-description" class="hint"></p>
<div class="row"><button id="cancel-delete" class="secondary" autofocus>取消</button><button id="confirm-delete" class="danger">确认删除</button></div>
</dialog>
<script type="module" src="popup.js"></script>
</body></html>
